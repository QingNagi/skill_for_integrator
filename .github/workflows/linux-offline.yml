name: Linux offline kits
on:
  pull_request:
  push:
    paths:
      - 'traced-template-fill/**'
      - 'tests/**'
      - 'tools/build_offline_bundle.py'
      - 'tools/fetch_vendor.py'
      - 'tools/prepare_win64_runtime.py'
      - 'tools/runtime_bom.py'
      - 'tools/build_ocr_runtime.py'
      - 'tools/offline/**'
      - 'tools/skill-files.txt'
      - 'tools/build_linux_agent_kit.py'
      - 'qa/check_linux_kit.sh'
      - 'qa/check_linux_pair.sh'
      - 'qa/run_tests.py'
      - '.github/workflows/linux-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-core:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, windows-2022]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify the source CLI and record compatibility
        shell: bash
        run: |
          python -B traced-template-fill/scripts/di.py --help
          python -m pip install --only-binary=:all: 'python-docx==1.2.0' 'openpyxl==3.1.5'
          if [[ "${{ matrix.python }}" == "3.10" ]]; then
            python -m pip install --only-binary=:all: 'pypdf==6.21.4' 'Pillow==12.3.0' 'pypdfium2==5.15.2' 'pdfplumber==0.11.10'
          else
            python -m pip install --only-binary=:all: 'pdfplumber==0.11.11' 'pypdf==6.21.4' 'Pillow==13.0.0' 'pypdfium2==5.15.2'
          fi
          python -B qa/run_tests.py 2>&1 | tee "$RUNNER_TEMP/source-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-tests-${{ matrix.runner }}-${{ matrix.python }}
          path: ${{ runner.temp }}/source-tests.log
  offline:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and identify a native CI runtime in a disposable source copy
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          cd "$RUNNER_TEMP/source"
          arch=$(uname -m)
          case "$arch" in
            x86_64) hash=6eb9d4d759b292c83810dbee2e9e8e3fbfbf01d864e6e9811bae711fd74e1c2f ;;
            aarch64) hash=7994b27f3cbfcedea43f9b7552e38b45857bdf0e9a45065474092dd74e7048cf ;;
          esac
          /usr/bin/python3.12 -m venv "$RUNNER_TEMP/zig"
          printf 'ziglang==0.14.1 --hash=sha256:%s\n' "$hash" > "$RUNNER_TEMP/zig/requirements.txt"
          "$RUNNER_TEMP/zig/bin/pip" install --no-deps --only-binary=:all: --require-hashes \
            --report "$RUNNER_TEMP/zig/install.json" -r "$RUNNER_TEMP/zig/requirements.txt"
          # Host-only decoder for lossless conversion of Leptonica's embedded TIFF font sheets.
          echo 'Pillow==13.0.0 --hash=sha256:8bf295fe459343bc6093c8e5e0df60bfa189e0fcb775a22e2c2488fdeccc6c0d --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca' > "$RUNNER_TEMP/zig/font-tools.txt"
          "$RUNNER_TEMP/zig/bin/pip" install --no-deps --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/zig/font-tools.txt"
          zig=$("$RUNNER_TEMP/zig/bin/python" -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).with_name("zig"))')
          "$RUNNER_TEMP/zig/bin/python" tools/build_ocr_runtime.py --platform "manylinux_$arch" --zig "$zig"
          # The published lock identifies the Windows-hosted cross build. Record the
          # compiler and executable from this native CI build in this copy only.
          python3 - "manylinux_$arch" "$RUNNER_TEMP/zig/install.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          platform, report = sys.argv[1:]
          path = Path("traced-template-fill/vendor/ocr.lock.json")
          lock = json.loads(path.read_text())
          compiler = json.loads(Path(report).read_text())["install"][0]["download_info"]
          lock["sources"]["zig-toolchain"].update(url=compiler["url"], sha256=compiler["archive_info"]["hashes"]["sha256"])
          binary = Path(".build/vendor/ocr") / platform / "tesseract"
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          print("Native CI OCR SHA256", digest, "published release OCR SHA256", lock["binaries"][platform]["sha256"])
          lock["binaries"][platform].update(sha256=digest, size=binary.stat().st_size)
          path.write_text(json.dumps(lock, indent=2) + "\n")
          PY
          python3 tools/build_linux_agent_kit.py --arch "$arch" --fetch-inputs --from-dir "$RUNNER_TEMP/inputs" --out "$RUNNER_TEMP/dist"
          python3 tools/build_offline_bundle.py --platform source --tag ci --out "$RUNNER_TEMP/dist"
          python3 tools/build_linux_agent_kit.py --runtime-only --arch "$arch" --from-dir "$RUNNER_TEMP/inputs" --out "$RUNNER_TEMP/dist"
          python3 - "$RUNNER_TEMP/dist" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import build_offline_bundle as bundle
          dist = Path(sys.argv[1])
          for script in bundle.installers(dist, "ci"):
              (dist / (script.name + ".sha256")).write_text(bundle.fv.sha256_of(script) + "  " + script.name + "\n")
          (dist / "SHA256SUMS-ci.txt").write_text("".join(p.read_text() for p in sorted(dist.glob("*.sha256"))))
          PY
      - name: Run the full suite with the required offline PDF and OCR stack
        shell: bash
        run: |
          cd "$RUNNER_TEMP/source"
          arch=$(uname -m)
          mkdir -p "$RUNNER_TEMP/test-python" traced-template-fill/runtime/{ocr,tessdata}
          tar -xzf "$RUNNER_TEMP/inputs/"*"$arch"-unknown-linux-gnu-install_only_stripped.tar.gz -C "$RUNNER_TEMP/test-python"
          cp ".build/vendor/ocr/manylinux_$arch/tesseract" traced-template-fill/runtime/ocr/
          cp "$RUNNER_TEMP/inputs/"*.traineddata traced-template-fill/runtime/tessdata/
          DI_VENDOR_DIR="$PWD/.build/vendor" "$RUNNER_TEMP/test-python/python/bin/python3" -B qa/run_tests.py --require-ocr | tee "$RUNNER_TEMP/full-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-tests-${{ matrix.runner }}
          path: ${{ runner.temp }}/full-tests.log
      - name: Prepare a host with an existing Office conversion backend
        run: |
          if ! command -v soffice >/dev/null; then
            sources=/etc/apt/sources.list.d/ubuntu.sources
            if [[ ! -s "$sources" ]]; then sources=/etc/apt/sources.list; fi
            apt_sources=(-o "Dir::Etc::sourcelist=$sources" -o 'Dir::Etc::sourceparts=-' -o Acquire::Retries=3)
            sudo apt-get "${apt_sources[@]}" -qq update
            sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends libreoffice-writer
          fi
      - name: Validate package on its native CPU without network access
        run: |
          sudo unshare --net -- runuser -u "$(id -un)" -- bash qa/check_linux_kit.sh "$RUNNER_TEMP/linux-offline.json" "$RUNNER_TEMP/dist"
          sudo unshare --net -- runuser -u "$(id -un)" -- bash qa/check_linux_pair.sh "$RUNNER_TEMP/dist" traced-template-fill-ci-source.zip
          {
            echo "### $(uname -m) offline acceptance"
            echo 'Cold runs use independent application caches. Times are milliseconds.'
            echo '~~~json'
            cat "$RUNNER_TEMP/linux-offline.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-acceptance-${{ matrix.runner }}
          path: ${{ runner.temp }}/linux-offline.json
